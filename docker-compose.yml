services:

  postgres:
    image: postgres:16
    container_name: retail-postgres

    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d retail"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: retail-pipeline

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/retail

    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

volumes:
  postgres_data: